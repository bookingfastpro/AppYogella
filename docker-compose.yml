# L'application dans son image de production (API + front dans un seul
# conteneur, exactement ce que déploie Coolify), branchée sur Supabase.
#
#   docker compose up --build   →  http://localhost:3000
#
# La base et les comptes vivent dans Supabase : les variables (DATABASE_URL,
# DIRECT_URL, SUPABASE_*) sont lues dans server/.env — voir server/.env.example.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      # Le conteneur écoute sur 3000 et sert le front lui-même.
      PORT: 3000
      NODE_ENV: production
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  uploads:
